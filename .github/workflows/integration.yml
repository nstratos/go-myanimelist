name: integration

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10 * * 6"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.x

    - name: Mod verify
      run: go mod verify

    - name: Run all tests including integration tests
      run: |
        cd mal
        go test -v \
          --client-id='${{ secrets.MAL_CLIENT_ID }}' \
          --client-secret='${{ secrets.MAL_CLIENT_SECRET }}' \
          --oauth2-token='${{ secrets.MAL_OAUTH2_TOKEN }}'
